services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    profiles: [app]
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]
    environment: &app-env
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    profiles: [app]
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      - api

volumes:
  pgdata:
